name: Flutter Release

# Manual runs produce artifacts you can download from the run page.
# Pushing a v* tag additionally collects them into a draft GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Needed by the release job to create the Release and upload its assets.
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.7'

jobs:

  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze


  android:
    name: Build Android
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab


  windows:
    name: Build Windows
    needs: analyze
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # Zipped here rather than left to upload-artifact so the Release gets one
      # named asset instead of a folder the action re-zips under its own name.
      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/HozaSend-windows.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/HozaSend-windows.zip


  macos:
    name: Build macOS
    needs: analyze
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      # The Runner target sets CODE_SIGN_IDENTITY = "-", so Xcode has already
      # ad-hoc signed the bundle together with Release.entitlements. Do NOT
      # re-sign here: `codesign --force --deep --sign -` without --entitlements
      # drops the sandbox keys, and a sandbox denial is invisible to the app -
      # the build would launch and simply never reach the network.
      - name: Verify signature and entitlements
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP"

      # upload-artifact rebuilds the .app from a plain file list, which drops
      # the executable bit and flattens the framework symlinks - the downloaded
      # bundle then refuses to launch. ditto preserves both inside a zip.
      - name: Package macOS app
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/HozaSend-macos.zip

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/HozaSend-macos.zip


  ios:
    name: Build iOS
    needs: analyze
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # An unsigned build has no .ipa of its own, so the .app is wrapped in the
      # Payload/ layout by hand. It still needs signing before it will install
      # on a device.
      - name: Package unsigned IPA
        run: |
          APP=$(ls -d build/ios/iphoneos/*.app | head -1)
          mkdir -p build/ios/Payload
          cp -R "$APP" build/ios/Payload/
          cd build/ios && zip -qry HozaSend-ios-unsigned.ipa Payload

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/HozaSend-ios-unsigned.ipa


  release:
    name: Publish release
    # Only on a v* tag; a plain manual run just leaves the artifacts behind.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          # Left as a draft so the untested Apple builds get a look before
          # anyone can download them. Publish from the Releases page.
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
