name: Flutter Release

on:
  workflow_dispatch:

jobs:

  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab


  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/


  macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      # upload-artifact rebuilds the .app from a plain file list, which drops
      # the executable bit and flattens the framework symlinks - the downloaded
      # bundle then refuses to launch. ditto preserves both inside a zip.
      - name: Package macOS app
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/HozaSend-macos.zip

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/HozaSend-macos.zip


  ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # An unsigned build has no .ipa of its own, so the .app is wrapped in the
      # Payload/ layout by hand. It still needs signing before it will install
      # on a device.
      - name: Package unsigned IPA
        run: |
          APP=$(ls -d build/ios/iphoneos/*.app | head -1)
          mkdir -p build/ios/Payload
          cp -R "$APP" build/ios/Payload/
          cd build/ios && zip -qry HozaSend-ios-unsigned.ipa Payload

      - name: Upload iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/HozaSend-ios-unsigned.ipa
